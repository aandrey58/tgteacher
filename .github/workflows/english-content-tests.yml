name: English content tests

on:
  push:
    branches: [english-adaptation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: tgteacher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgteacher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TGTEACHER_TEST_DSN: postgresql://postgres:testpassword@localhost:5432/tgteacher_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Compile Python
        run: python -m compileall -q bot tests
      - name: Run regression and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v

  release-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated smoke credentials
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only-password/' .env
          cp bot.env.example bot.env
          echo 'BOT_TOKEN=123456:ci-only-test-token' >> bot.env
          cp mcp.env.example mcp.env
          echo 'TGTEACHER_MCP_READ_TOKEN=rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr' >> mcp.env
          echo 'TGTEACHER_MCP_EDIT_TOKEN=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee' >> mcp.env
          echo 'TGTEACHER_MCP_PUBLISH_TOKEN=pppppppppppppppppppppppppppppppp' >> mcp.env
          cp admin.env.example admin.env
          echo 'WEB_ADMIN_SECRET=ci-only-web-admin-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' >> admin.env
          mkdir -p runtime_cache bot/exports
          docker compose config --quiet
      - name: Build release containers
        run: docker compose build bot mcp
      - name: Start isolated DB and MCP
        run: docker compose up -d --wait --wait-timeout 120 db mcp
      - name: Verify readiness, protected discovery and runtime bot registration
        run: |
          curl --fail --silent http://127.0.0.1:8000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' http://127.0.0.1:8000/mcp)" = 401
          curl --fail --silent -H 'Authorization: Bearer rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'MCP-Protocol-Version: 2025-06-18' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' http://127.0.0.1:8000/mcp | python -c 'import sys,json; assert len(json.load(sys.stdin)["result"]["tools"])==45'
          docker compose run --rm --no-deps bot python -c 'from tgteacher_bot.core.app import build_application; a=build_application(); assert a.job_queue is not None; assert a.handlers'
      - name: Build and start React admin
        run: |
          docker compose --profile web build admin
          docker compose --profile web up -d admin
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep 'TGTeacher Admin'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/groups)" = 401
      - name: Seed synthetic screenshot data
        run: docker compose --profile web exec -T admin python - < tests/seed_web_demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify responsive React flows in Chromium and WebKit
        working-directory: admin-web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: Upload admin browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-evidence
          path: admin-web/test-results/
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: docker compose --profile web down -v
