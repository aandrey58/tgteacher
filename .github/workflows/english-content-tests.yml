name: English content tests

on:
  push:
    branches: [english-adaptation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: tgteacher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tgteacher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TGTEACHER_TEST_DSN: postgresql://postgres:testpassword@localhost:5432/tgteacher_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install asyncpg python-telegram-bot pyzipper 'mcp>=1.26,<2' uvicorn python-dotenv 'mutagen>=1.47,<2' 'Pillow>=11.3,<13'
      - name: Verify FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Compile Python
        run: python -m compileall -q bot tests
      - name: Run regression and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
